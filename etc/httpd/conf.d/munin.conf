# munin html
# Access requires an account in /etc/munin/munin-htpasswd - the file ships empty,
# so munin fails closed until bootstrap runs: htpasswd -B -c /etc/munin/munin-htpasswd <user>
Alias /munin /var/lib/munin/html
<directory /var/lib/munin/html>
ExpiresActive On
ExpiresDefault M310
AuthType Basic
AuthName "Munin"
AuthUserFile /etc/munin/munin-htpasswd
Require valid-user
</directory>
AddType text/css .css
AddType text/javascript .js
ScriptAlias /munin-cgi/ /var/www/html/munin/cgi/
<Location /munin-cgi/>
  Options ExecCGI
  SetHandler cgi-script
  AuthType Basic
  AuthName "Munin"
  AuthUserFile /etc/munin/munin-htpasswd
  Require valid-user
</Location>
