# send all munin requests to apache
# Credentials are the same file apache uses; it ships empty so munin fails closed
# until bootstrap runs: htpasswd -B -c /etc/munin/munin-htpasswd <user>
  location /munin {
    auth_basic              "Munin";
    auth_basic_user_file    /etc/munin/munin-htpasswd;
    proxy_redirect          http:// https://;
    proxy_pass              https://apache/munin;
    proxy_set_header        Host $host:$server_port;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    }

  location /munin-cgi {
    auth_basic              "Munin";
    auth_basic_user_file    /etc/munin/munin-htpasswd;
    proxy_redirect          http:// https://;
    proxy_pass              https://apache/munin-cgi;
    proxy_set_header        Host $host:$server_port;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    }
