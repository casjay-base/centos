#Certbot DNS
# Ships with an empty secret on purpose - fill it in on the host, never in
# git; pkmgr's bootstrap keeps any existing /etc/certbot/dns.conf and
# chmods it 0600
# Target DNS server
dns_rfc2136_server = localhost
# TSIG key name
dns_rfc2136_name = certbot.
# TSIG key secret - dnssec-keygen -a HMAC-SHA512 -b 512 -n localhost certbot.
dns_rfc2136_secret =
# TSIG key algorithm
dns_rfc2136_algorithm = HMAC-SHA512
