# Enable tls in proftpd
# TLSRequired on applies to the anonymous <Anonymous ~ftp> block too - clients
# must speak FTPS (AUTH TLS); plain cleartext FTP is refused
PassivePorts              49152 65534
TLSEngine                 on
TLSRequired               on
TLSProtocol               TLSv1.2 TLSv1.3
TLSVerifyClient           off
TLSRenegotiate            none
TLSLog                    /var/log/proftpd/tls.log

#LECerts
TLSRSACertificateFile     /etc/letsencrypt/live/domain/fullchain.pem
TLSRSACertificateKeyFile  /etc/letsencrypt/live/domain/privkey.pem
##
